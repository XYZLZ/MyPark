openapi: 3.1.0
info:
  title: MyPark API
  version: 0.1.0
  description: MyPark HTTP API. M0 exposes health and readiness probes only.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 while the process is up. Does not check dependencies.
      tags: [health]
      security: []
      responses:
        "200":
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        Returns 200 when the database is reachable and migrations are current.
        Otherwise returns 503 with code "health.not_ready" and the same checks
        object in error.details.
      tags: [health]
      security: []
      responses:
        "200":
          description: The service is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: The service is not ready. error.code is "health.not_ready".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: health.not_ready
                  message: service is not ready
                  details:
                    database: ok
                    migrations: behind
                  request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          description: Service name.
        version:
          type: string
          description: Build version of the running binary.
    ReadinessChecks:
      type: object
      additionalProperties: false
      required: [database, migrations]
      properties:
        database:
          type: string
          enum: [ok, fail]
        migrations:
          type: string
          enum: [ok, behind, fail]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          $ref: "#/components/schemas/ReadinessChecks"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: >-
                Stable machine-readable code in "<domain>.<reason>" snake_case
                format. This is the client contract; see
                packages/contracts/src/error-codes.ts.
              pattern: '^[a-z][a-z0-9_]*[.][a-z][a-z0-9_]*$'
            message:
              type: string
              description: Developer-facing message. Never shown to end users.
            details:
              type: object
              description: >-
                Optional structured context for the error. The server currently
                always sends this key, possibly as an empty object {}. For
                health.not_ready it carries the ReadinessChecks object.
              additionalProperties: true
            request_id:
              type: string
              description: Request correlation identifier.
