openapi: 3.1.0
info:
  title: MyPark API
  version: 0.1.0
  description: >-
    MyPark HTTP API. Every response uses the baseline envelope: data and meta
    on success, error and meta on failure.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: legal
    description: Current terms and privacy documents.
  - name: auth
    description: Registration, login, sessions and password recovery.
  - name: me
    description: The current user.
  - name: vehicles
    description: The current driver's vehicles.
  - name: lots
    description: Public lot discovery, availability, spaces and tariff.
  - name: reservations
    description: The current driver's reservations, QR and card payment.
  - name: payments
    description: The current driver's payments and receipts.
  - name: admin
    description: Admin user management.
  - name: devices
    description: Signed device events from the parking hardware.
  - name: simulator
    description: Control API of the device simulator (compose-internal, served by the simulator service).
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 while the process is up. Does not check dependencies.
      tags: [health]
      security: []
      responses:
        "200":
          description: The service is alive.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        $ref: "#/components/schemas/Health"
                      meta:
                        $ref: "#/components/schemas/Meta"
        "500": { $ref: "#/components/responses/InternalError" }
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        Returns 200 when the database is reachable and migrations are current.
        Otherwise returns 503 with code "health.not_ready" and the same checks
        object in error.details.
      tags: [health]
      security: []
      responses:
        "200":
          description: The service is ready to serve traffic.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        $ref: "#/components/schemas/Readiness"
                      meta:
                        $ref: "#/components/schemas/Meta"
        "503":
          description: The service is not ready. error.code is "health.not_ready".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: health.not_ready
                  message: service is not ready
                  details:
                    database: ok
                    migrations: behind
                meta:
                  request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/legal/current:
    get:
      operationId: getLegalCurrent
      summary: Current terms and privacy documents
      tags: [legal]
      security: []
      responses:
        "200":
          description: The current terms and privacy documents.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/LegalCurrent" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/register:
    post:
      operationId: register
      summary: Register a driver account
      description: >-
        Always answers 202 with the same body, whether or not the email is
        already in use, so the endpoint does not reveal which emails exist.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: Registration accepted. A verification code is emailed.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [status]
                        properties:
                          status: { type: string, const: verification_pending }
                      meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: The submitted legal versions are not the current ones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: legal.version_outdated
                  message: legal version outdated
                  details: { terms_version: "2026-11-16", privacy_version: "2026-11-16" }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/verify:
    post:
      operationId: verifyEmail
      summary: Verify an email address with the emailed code
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "204": { description: Email verified. No body. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationOrCodeInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/verify/resend:
    post:
      operationId: resendVerification
      summary: Resend the verification code
      description: Always answers 202, whether or not the account exists.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendVerificationRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in. Returns an access token and a refresh token.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/TokenResponse" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Wrong email or password. One code for both.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: auth.invalid_credentials, message: invalid credentials, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "403":
          description: Correct password, but the account cannot log in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                emailNotVerified:
                  summary: The account is pending email verification.
                  value:
                    error: { code: auth.email_not_verified, message: email not verified, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
                accountSuspended:
                  summary: The account is suspended.
                  value:
                    error: { code: auth.account_suspended, message: account suspended, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and get a new access token
      description: >-
        An empty, malformed or unknown refresh token is answered with 401
        auth.refresh_invalid, never 422.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshSessionRequest" }
      responses:
        "200":
          description: Session refreshed.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/TokenResponse" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The refresh token is unknown, expired or already rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                refreshInvalid:
                  summary: Unknown, expired or malformed refresh token.
                  value:
                    error: { code: auth.refresh_invalid, message: refresh token invalid, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
                sessionRevoked:
                  summary: The session was revoked or the token was reused.
                  value:
                    error: { code: auth.session_revoked, message: session revoked, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      description: >-
        A second logout with an already revoked session answers 401
        auth.session_revoked, not 204.
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked. No body. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session of the current user
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: All sessions revoked. No body. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a password reset code
      description: Always answers 202, whether or not the account exists.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with the emailed code
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password changed and every session revoked. No body. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationOrCodeInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an admin invitation and set a password
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "204": { description: Invitation accepted. No body. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationOrCodeInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/me:
    get:
      operationId: getMe
      summary: Get the current user
      tags: [me]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/User" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateMe
      summary: Update the current user profile
      description: A null phone clears it.
      tags: [me]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/User" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteMe
      summary: Delete the current driver account
      description: Requires the current password. Not blocked by a pending legal acceptance.
      tags: [me]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteMeRequest" }
      responses:
        "204": { description: Account deleted. No body. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role or account state not allowed, or the password is wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                forbidden:
                  summary: The role is not allowed on this route.
                  value:
                    error: { code: auth.forbidden, message: forbidden, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
                accountSuspended:
                  summary: The account is suspended.
                  value:
                    error: { code: auth.account_suspended, message: account suspended, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
                passwordIncorrect:
                  summary: Re-authentication failed.
                  value:
                    error: { code: auth.password_incorrect, message: password incorrect, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/me/legal-acceptance:
    post:
      operationId: acceptLegal
      summary: Accept the current terms and privacy versions
      tags: [me]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptLegalRequest" }
      responses:
        "204": { description: Acceptance stored. No body. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The submitted versions are not the current ones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: legal.version_outdated
                  message: legal version outdated
                  details: { terms_version: "2026-11-16", privacy_version: "2026-11-16" }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/vehicles:
    get:
      operationId: listVehicles
      summary: List the current driver's vehicles
      description: >-
        At most MAX_VEHICLES_PER_USER (5) items. meta.page.limit equals that
        cap and meta.page.next_cursor is always null.
      tags: [vehicles]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The driver's vehicles.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Vehicle" }
                      meta: { $ref: "#/components/schemas/ListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createVehicle
      summary: Register a vehicle
      tags: [vehicles]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVehicleRequest" }
      responses:
        "201":
          description: The created vehicle.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/Vehicle" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "409":
          description: The plate is already in use, or the vehicle limit is reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                plateTaken:
                  summary: The plate is active on another account.
                  value:
                    error: { code: vehicle.plate_taken, message: plate already registered, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
                limitReached:
                  summary: The driver already has the maximum number of vehicles.
                  value:
                    error: { code: vehicle.limit_reached, message: vehicle limit reached, details: { limit: 5 } }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/vehicles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Vehicle id. A malformed id is answered 404 vehicle.not_found.
        schema: { type: string, format: uuid }
    get:
      operationId: getVehicle
      summary: Get one of the current driver's vehicles
      tags: [vehicles]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The vehicle.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/Vehicle" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404": { $ref: "#/components/responses/VehicleNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateVehicle
      summary: Update one of the current driver's vehicles
      tags: [vehicles]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVehicleRequest" }
      responses:
        "200":
          description: The updated vehicle.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/Vehicle" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404": { $ref: "#/components/responses/VehicleNotFound" }
        "409":
          description: The plate is active on another account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: vehicle.plate_taken, message: plate already registered, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteVehicle
      summary: Delete one of the current driver's vehicles
      tags: [vehicles]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Vehicle deleted. No body. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404": { $ref: "#/components/responses/VehicleNotFound" }
        "409":
          description: The vehicle is in use by an active reservation (from M3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: vehicle.in_use, message: vehicle in use, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/lots:
    get:
      operationId: listLots
      summary: List the lots
      description: >-
        Discovery call for both clients: the lot public id differs per
        database. M2 has one lot, so the page never has a next cursor.
      tags: [lots]
      security: []
      responses:
        "200":
          description: The lots.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LotSummary" }
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/Meta"
                      - type: object
                        required: [page]
                        properties:
                          page: { $ref: "#/components/schemas/Page" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/lots/{id}:
    parameters:
      - $ref: "#/components/parameters/LotId"
    get:
      operationId: getLot
      summary: Get one lot
      tags: [lots]
      security: []
      responses:
        "200":
          description: The lot.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Lot" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "404": { $ref: "#/components/responses/LotNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/lots/{id}/availability:
    parameters:
      - $ref: "#/components/parameters/LotId"
    get:
      operationId: getLotAvailability
      summary: Get the current availability of a lot
      description: >-
        Pending entries (a ticket was issued but the barrier has not been
        passed yet) are not counted in `occupied` or `available` (spec §5.2
        rule 5 counts them as occupied only for gate decisions). A pending
        entry is voided after 60 s, so for up to 60 s the figures can show a
        space that the gate already treats as taken. The stream shows the same
        figures.
      tags: [lots]
      security: []
      responses:
        "200":
          description: The current availability snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Availability" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "404": { $ref: "#/components/responses/LotNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/lots/{id}/spaces:
    parameters:
      - $ref: "#/components/parameters/LotId"
    get:
      operationId: getLotSpaces
      summary: Get the state of every space in a lot
      tags: [lots]
      security: []
      responses:
        "200":
          description: Every space, ordered by code.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/LotSpaces" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "404": { $ref: "#/components/responses/LotNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/lots/{id}/tariff:
    parameters:
      - $ref: "#/components/parameters/LotId"
    get:
      operationId: getLotTariff
      summary: Get the current tariff of a lot
      tags: [lots]
      security: []
      responses:
        "200":
          description: The tariff version in force.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Tariff" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "404": { $ref: "#/components/responses/LotNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/lots/{id}/availability/stream:
    parameters:
      - $ref: "#/components/parameters/LotId"
    get:
      operationId: streamLotAvailability
      summary: Stream the availability of a lot (server-sent events)
      description: >-
        The first event is always the current `availability` snapshot. Event
        `data` lines are bare JSON objects, not wrapped in the response
        envelope. The stream sends `retry: 3000` once, then three named
        events. `availability` (payload `Availability`, event id is its
        `version`) is sent on every change, at most one push per 250 ms.
        `spaces` (payload `SpacesEvent`, only with `include=spaces`) starts
        with a full snapshot and continues with deltas; after a missed update
        or a reconnect the server sends a full snapshot again. `heartbeat`
        (payload `HeartbeatEvent`) is sent every 15 seconds. The `spaces` event
        is sent only when the whole query string is exactly `include=spaces`;
        any other query, including an extra parameter such as a cache-busting
        `_=123` that an `EventSource` wrapper adds, gets the stream without it,
        so clients must not append parameters. Unknown `include` values and a
        malformed `Last-Event-ID` are ignored. The response carries
        `X-Accel-Buffering: no` so a buffering reverse proxy passes each event
        through at once. The connection
        caps are checked before the stream starts and answer 429 with
        `Retry-After`.
      tags: [lots]
      security: []
      parameters:
        - name: include
          in: query
          required: false
          description: Add the `spaces` event to the stream.
          schema: { type: string, enum: [spaces] }
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last `availability` event received.
          schema: { type: string }
      responses:
        "200":
          description: >-
            An open event stream. Events are `availability` (Availability),
            `spaces` (SpacesEvent) and `heartbeat` (HeartbeatEvent).
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Accel-Buffering:
              description: Tells a buffering reverse proxy (nginx) to pass each event through at once.
              schema: { type: string, const: "no" }
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Server-sent events. The `data` of an `availability` event is
                  an Availability object, of a `spaces` event a SpacesEvent, and
                  of a `heartbeat` event a HeartbeatEvent.
              examples:
                stream:
                  summary: First frames of a stream with include=spaces.
                  value: |
                    retry: 3000

                    event: availability
                    id: 1042
                    data: {"lot_id":"0192f4a0-7b1c-7c3e-9d52-3f6a8b1c2d4e","available":12,"occupied":268,"effective_capacity":280,"capacity":280,"effective_holds":0,"upcoming_reservations_2h":0,"status":"open","version":1042,"updated_at":"2026-11-24T14:03:11Z"}

                    event: spaces
                    data: {"full":true,"spaces":[{"code":"E001","state":"occupied"}]}

                    event: heartbeat
                    data: {"as_of":"2026-11-24T14:03:26Z"}
        "404": { $ref: "#/components/responses/LotNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/reservations/quote:
    post:
      operationId: quoteReservation
      summary: Quote a reservation without creating it
      description: >-
        Runs the create checks read-only. `arrival_at` is accepted in any UTC
        offset or fraction and echoed normalized to the next 5-minute UTC
        boundary. The capacity answer comes from an unlocked read, so a quote
        can succeed and the create can still answer `reservation.capacity_reached`.
      tags: [reservations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Quote" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404": { $ref: "#/components/responses/LotOrVehicleNotFound" }
        "409": { $ref: "#/components/responses/ReservationRefused" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ReservationArrivalInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/reservations:
    post:
      operationId: createReservation
      summary: Reserve a space
      description: >-
        Creates a `pending_payment` reservation and holds a space for the
        window around the arrival. The driver has one active (`pending_payment`
        or `confirmed`) reservation at a time. Pay it with `payReservation`
        before `payment_due_at`.
      tags: [reservations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReservationRequest" }
      responses:
        "201":
          description: The created reservation.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Reservation" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404": { $ref: "#/components/responses/LotOrVehicleNotFound" }
        "409": { $ref: "#/components/responses/ReservationRefused" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ReservationArrivalInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listReservations
      summary: List the current driver's reservations
      description: Newest arrival first, keyset-paginated. `scope=active` is `pending_payment`, `confirmed` and `checked_in`; `scope=past` is the rest.
      x-mypark-pending: S3.3
      tags: [reservations]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [active, past], default: active } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, required: false, description: Opaque cursor from `meta.page.next_cursor`., schema: { type: string } }
      responses:
        "200":
          description: A page of reservations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/reservations/{id}:
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    get:
      operationId: getReservation
      summary: Get one of the current driver's reservations
      x-mypark-pending: S3.3
      tags: [reservations]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/ReservationOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: changeReservationVehicle
      summary: Change the vehicle of a confirmed reservation
      description: >-
        Only a `confirmed` reservation, and only before `arrival_at`. Fee,
        window and QR are unchanged. The same vehicle is a no-op `200`.
      x-mypark-pending: S3.3
      tags: [reservations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeVehicleRequest" }
      responses:
        "200": { $ref: "#/components/responses/ReservationOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404":
          description: The reservation or the new vehicle does not exist, or is not the driver's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                reservationNotFound:
                  value: { error: { code: reservation.not_found, message: reservation not found, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
                vehicleNotFound:
                  value: { error: { code: vehicle.not_found, message: vehicle not found, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
        "409":
          description: The reservation is not `confirmed`, or the arrival time has passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                invalidState:
                  value: { error: { code: reservation.invalid_state, message: invalid reservation state, details: { status: pending_payment } }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
                vehicleChangeClosed:
                  value: { error: { code: reservation.vehicle_change_closed, message: vehicle change closed, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/reservations/{id}/pay:
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    post:
      operationId: payReservation
      summary: Pay the reservation fee with a card
      description: >-
        Charges the reservation fee on the simulated gateway. The call is
        idempotent per reservation and `Idempotency-Key`: a replay returns the
        stored answer with `Idempotent-Replayed: true`, the same key with
        another card is `409 idempotency.key_reused`, and one key may be used
        on two different reservations. Spaces and hyphens in `card_number` are
        ignored. Test cards: `4242 4242 4242 4242` succeeds, `4000 0000 0000 0002`
        is declined (`card_declined`), `4000 0000 0000 9995` succeeds but answers
        after the gateway deadline, so the call returns `202` and the
        reservation is confirmed shortly after (poll `getReservation`); any
        other Luhn-valid number is declined (`card_not_supported`). Card data
        is never echoed, logged or stored beyond brand and last four.
      x-mypark-pending: S4.2
      tags: [reservations]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key, one per pay attempt.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayRequest" }
      responses:
        "200":
          description: The charge succeeded (or replays a succeeded attempt). The reservation is `confirmed`.
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Reservation" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "202":
          description: The gateway did not answer in time. The charge is `pending`; poll `getReservation`.
          headers:
            Retry-After:
              description: Seconds to wait before polling again.
              schema: { type: integer, examples: [2] }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/PayPending" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: The charge was declined (or replays a failed attempt).
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: payment.declined
                  message: payment declined
                  details: { payment_id: 0191a2b3-c4d5-7e6f-8a9b-0c1d2e3f4a5b, failure_code: card_declined }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }
        "409":
          description: Another attempt is pending, the reservation cannot be paid, its payment time ran out, or the key was used with another card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                inProgress:
                  value: { error: { code: payment.in_progress, message: payment in progress, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
                invalidState:
                  value: { error: { code: reservation.invalid_state, message: invalid reservation state, details: { status: confirmed } }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
                paymentExpired:
                  value: { error: { code: reservation.payment_expired, message: payment expired, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
                keyReused:
                  value: { error: { code: idempotency.key_reused, message: idempotency key reused, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/reservations/{id}/qr:
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    get:
      operationId: getReservationQr
      summary: Get the entry QR token of a reservation
      description: Available for `confirmed` and `checked_in` reservations. The token is secret and is never logged.
      x-mypark-pending: S4.2
      tags: [reservations]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The QR token.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/ReservationQr" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }
        "409":
          description: The reservation is not `confirmed` or `checked_in`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: reservation.invalid_state, message: invalid reservation state, details: { status: pending_payment } }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/reservations/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    post:
      operationId: cancelReservation
      summary: Cancel a reservation
      description: >-
        A `pending_payment` reservation is cancelled with no refund. A
        `confirmed` one before `arrival_at` is cancelled with a full refund
        (`refund.status` is `pending`); at or after `arrival_at` it is
        cancelled with no refund. Cancelling an already cancelled reservation
        is a `200`. No body.
      x-mypark-pending: S5.1
      tags: [reservations]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/ReservationOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404": { $ref: "#/components/responses/ReservationNotFound" }
        "409":
          description: A payment attempt is pending, or the reservation cannot be cancelled in its state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                inProgress:
                  value: { error: { code: payment.in_progress, message: payment in progress, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
                invalidState:
                  value: { error: { code: reservation.invalid_state, message: invalid reservation state, details: { status: checked_in } }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/payments:
    get:
      operationId: listPayments
      summary: List the current driver's payments and receipts
      description: Newest first, keyset-paginated.
      x-mypark-pending: S5.3
      tags: [payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, required: false, description: Opaque cursor from `meta.page.next_cursor`., schema: { type: string } }
      responses:
        "200":
          description: A page of payments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/payments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Payment id. A malformed, unknown or another driver's id is answered 404 payment.not_found.
        schema: { type: string, format: uuid }
    get:
      operationId: getPayment
      summary: Get one of the current driver's payments
      x-mypark-pending: S5.3
      tags: [payments]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Receipt" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenLegal" }
        "404":
          description: The payment does not exist, is not the driver's, or the id is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: payment.not_found, message: payment not found, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/admins:
    get:
      operationId: listAdmins
      summary: List admin users
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous meta.page.next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: A page of admin users.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminUser" }
                      meta: { $ref: "#/components/schemas/ListMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createAdmin
      summary: Invite an admin
      description: >-
        Answers 201 for a new invitation or when taking over a pending driver
        registration, and 200 when re-issuing the invitation to a pending
        invitee.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminRequest" }
      responses:
        "200":
          description: The invitation was re-issued to a pending invitee.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/AdminUser" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "201":
          description: The invitation was created.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data: { $ref: "#/components/schemas/AdminUser" }
                      meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The email belongs to an active or suspended account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: user.email_taken, message: email already in use, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/devices/events:
    post:
      operationId: postDeviceEvent
      summary: Submit one signed device event
      description: >-
        The single entry point for every parking device. The body is one
        `DeviceEvent`, a union discriminated by `type`. The request is signed
        with the device secret (`deviceHmac`) and is strictly decoded: unknown
        fields at any level are answered 422 `validation.failed` with rule
        `unknown_field`, a wrong JSON type is 400 `http.invalid_json`, a body
        that is not `application/json` is 415 and a body over 16 KiB is 413.
        `event_id` makes the call idempotent per device: a repeat with the same
        body returns the stored answer with `Idempotent-Replayed: true`, a
        repeat with a different body is 409 `device.event_conflict`. 4xx and
        5xx answers are never stored. Each device kind may send only some
        types; any other type is 403 `device.event_not_allowed`. A business
        refusal is a 200 with `result` `deny` or `rejected` and a `reason`
        code, not an HTTP error.
      tags: [devices]
      security:
        - deviceId: []
          deviceTimestamp: []
          deviceSignature: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/DeviceTimestamp"
        - $ref: "#/components/parameters/DeviceSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceEvent" }
            example:
              event_id: 019a6d00-0000-7000-8000-0000000000a1
              type: entry.credential_presented
              occurred_at: "2026-11-24T14:03:10Z"
              payload: { kind: ticket_request }
      responses:
        "200":
          description: The event was handled (or replayed).
          headers:
            Idempotent-Replayed:
              description: Present, with the value `true`, only when this is the stored answer of an earlier call.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/DeviceEventResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >-
            The device headers are missing or malformed, the device is unknown
            or revoked, the signature is wrong (`device.unauthenticated`), or
            `X-Timestamp` is more than 60 s from the server clock
            (`device.timestamp_out_of_window`). A user bearer token is ignored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                unauthenticated:
                  summary: Missing headers, unknown or revoked device, or a bad signature.
                  value:
                    error: { code: device.unauthenticated, message: device unauthenticated, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
                timestampOutOfWindow:
                  summary: X-Timestamp is outside the 60 s window.
                  value:
                    error: { code: device.timestamp_out_of_window, message: timestamp out of window, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "403":
          description: The device kind may not send this event type, credential kind or direction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: device.event_not_allowed, message: event not allowed for this device, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "409":
          description: The same `event_id` was already used by this device with a different body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: device.event_conflict, message: event id reused with a different body, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "413":
          description: The body is larger than 16 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: http.payload_too_large, message: payload too large, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /control/status:
    servers: [{ url: "http://simulator:8090" }]
    x-mypark-service: simulator
    get:
      operationId: getSimulatorStatus
      summary: Read the simulator state
      description: >-
        The simulator control API is compose-internal (M2C-46): it is served by
        the simulator service on port 8090, not by this API, and is reached by
        admins only through the web BFF. Every operation requires
        `X-Simulator-Token`.
      tags: [simulator]
      security: [{ simulatorToken: [] }]
      responses:
        "200":
          description: The current scenario state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulatorStatusResponse" }
        "401": { $ref: "#/components/responses/SimulatorUnauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /control/scenarios/start:
    servers: [{ url: "http://simulator:8090" }]
    x-mypark-service: simulator
    post:
      operationId: startSimulatorScenario
      summary: Start a scenario
      description: >-
        Starts one scenario. `reservation_arrivals` and `no_show` are not
        available in M2 (M2C-1) and are answered 422
        `simulator.scenario_unavailable`. The body is strictly decoded: unknown
        fields are 422 `validation.failed` with rule `unknown_field`, a wrong
        JSON type is 400 `http.invalid_json` and a body that is not
        `application/json` is 415.
      tags: [simulator]
      security: [{ simulatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartScenarioRequest" }
            example: { scenario: weekday, seed: 42, speed: 30, start_at: "2026-11-24T11:00:00Z" }
      responses:
        "202":
          description: The scenario was started. The body is the new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulatorStatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SimulatorUnauthorized" }
        "409":
          description: A scenario is already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: simulator.already_running, message: scenario already running, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422":
          description: >-
            Input validation failed (`validation.failed`), or the scenario is
            not available in M2 (`simulator.scenario_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                validationFailed:
                  summary: A field is invalid or unknown.
                  value:
                    error:
                      code: validation.failed
                      message: validation failed
                      details: { fields: [{ field: speed, rule: max, param: "120" }] }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
                scenarioUnavailable:
                  summary: The scenario is not built in M2.
                  value:
                    error: { code: simulator.scenario_unavailable, message: scenario unavailable, details: {} }
                    meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "500": { $ref: "#/components/responses/InternalError" }
  /control/scenarios/stop:
    servers: [{ url: "http://simulator:8090" }]
    x-mypark-service: simulator
    post:
      operationId: stopSimulatorScenario
      summary: Stop the running scenario
      description: >-
        With `drain` true, every car inside is scheduled to leave and the
        scenario completes when they are gone (at most 10 minutes); the drain
        runs after the answer, so the 202 status still shows `running` true
        and `GET /control/status` reports the end. Without `drain` the run is
        cut at once. The body is strictly decoded (see
        `startSimulatorScenario`).
      tags: [simulator]
      security: [{ simulatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopScenarioRequest" }
            example: { drain: true }
      responses:
        "202":
          description: The scenario is stopping. The body is the new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulatorStatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SimulatorUnauthorized" }
        "409":
          description: No scenario is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: simulator.not_running, message: scenario not running, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /control/cars:
    servers: [{ url: "http://simulator:8090" }]
    x-mypark-service: simulator
    post:
      operationId: injectSimulatorCar
      summary: Inject one car
      description: >-
        Sends one car through the lot. "Present an employee card" is
        `credential: employee_card`. A `hold` car parks until
        `leaveSimulatorCar` is called, which is how the demo shows a real
        non-zero fee. Injected cars run under the current scenario clock, or
        the real clock at speed 1 when idle. The body is strictly decoded (see
        `startSimulatorScenario`).
      tags: [simulator]
      security: [{ simulatorToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InjectCarRequest" }
            example: { credential: ticket, hold: true }
      responses:
        "202":
          description: The car was injected.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/InjectCarResponse" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SimulatorUnauthorized" }
        "409": { $ref: "#/components/responses/SimulatorNotRunning" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /control/cars/{car_id}/leave:
    servers: [{ url: "http://simulator:8090" }]
    x-mypark-service: simulator
    post:
      operationId: leaveSimulatorCar
      summary: Make a held car leave
      description: >-
        The car scans, pays and exits. "Mark ticket lost" is `lose_ticket`
        true. The body is strictly decoded (see `startSimulatorScenario`).
      tags: [simulator]
      security: [{ simulatorToken: [] }]
      parameters:
        - $ref: "#/components/parameters/CarId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaveCarRequest" }
            example: { lose_ticket: false }
      responses:
        "202":
          description: The car will leave. `data` is an empty object.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: object, additionalProperties: false }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SimulatorUnauthorized" }
        "409": { $ref: "#/components/responses/SimulatorNotRunning" }
        "404":
          description: There is no such car.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: simulator.car_not_found, message: car not found, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /control/sensors/{code}/fault:
    servers: [{ url: "http://simulator:8090" }]
    x-mypark-service: simulator
    post:
      operationId: setSimulatorSensorFault
      summary: Set a sensor fault
      description: >-
        `none` clears the fault. A space code the lot lacks is 422
        `validation.failed` on field `code`. The body is strictly decoded (see
        `startSimulatorScenario`).
      tags: [simulator]
      security: [{ simulatorToken: [] }]
      parameters:
        - name: code
          in: path
          required: true
          description: Space code, for example `A-001`.
          schema: { type: string, minLength: 1, maxLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensorFaultRequest" }
            example: { fault: stuck_occupied }
      responses:
        "204": { description: The fault was set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SimulatorUnauthorized" }
        "409": { $ref: "#/components/responses/SimulatorNotRunning" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /control/events:
    servers: [{ url: "http://simulator:8090" }]
    x-mypark-service: simulator
    get:
      operationId: listSimulatorEvents
      summary: List recent device outcomes
      description: >-
        A ring buffer of the last 500 device outcomes, oldest first. The
        console polls it with `after` set to the last `seq` it has seen.
      tags: [simulator]
      security: [{ simulatorToken: [] }]
      parameters:
        - name: after
          in: query
          required: false
          description: Return only entries with a `seq` greater than this. Default 0.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        "200":
          description: Up to 500 entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 500
                    items: { $ref: "#/components/schemas/SimulatorEvent" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/SimulatorUnauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  schemas:
    SimulatorStatus:
      type: object
      additionalProperties: false
      required: [scenario, running, seed, speed, virtual_now, cars_inside, reached_full]
      properties:
        scenario:
          description: The current or last scenario. Empty when none has run.
          type: string
          enum: ["", idle, weekday, weekend_peak, fill_to_full, sensor_drift, reservation_arrivals, no_show]
        running: { type: boolean }
        seed: { type: integer, format: int64, minimum: 0 }
        speed: { type: integer, minimum: 1, maximum: 120 }
        virtual_now: { type: string, format: date-time }
        cars_inside: { type: integer, minimum: 0 }
        started_at:
          description: Absent until a scenario has started.
          type: string
          format: date-time
        reached_full: { type: boolean }
    SimulatorStatusResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/SimulatorStatus" }
        meta: { $ref: "#/components/schemas/Meta" }
    StartScenarioRequest:
      type: object
      additionalProperties: false
      required: [scenario]
      properties:
        scenario:
          type: string
          enum: [idle, weekday, weekend_peak, fill_to_full, sensor_drift, reservation_arrivals, no_show]
        seed:
          description: >-
            Seeds every random draw of the run. Omitted, the simulator draws a
            random seed and reports it in the status, so the run can be replayed.
          type: integer
          format: int64
          minimum: 0
        speed: { type: integer, minimum: 1, maximum: 120, default: 30 }
        start_at: { type: string, format: date-time }
    StopScenarioRequest:
      type: object
      additionalProperties: false
      properties:
        drain: { type: boolean, default: false }
    InjectCarRequest:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          enum: [ticket, employee_card, reservation_qr]
        qr:
          description: >-
            The reservation QR token the car presents at the entry barrier,
            the pay station and the exit. Required with `reservation_qr` and
            not allowed with any other credential.
          type: string
          pattern: '^[A-Za-z0-9_-]{86}$'
        card:
          description: An employee card label. Only with `employee_card`.
          type: string
          pattern: '^EMP-[0-9]{3}$'
        hold: { type: boolean, default: false }
        dwell_minutes: { type: integer, minimum: 1, maximum: 600 }
    InjectCarResponse:
      type: object
      additionalProperties: false
      required: [car_id]
      properties:
        car_id: { type: string, example: car-000001 }
    LeaveCarRequest:
      type: object
      additionalProperties: false
      properties:
        lose_ticket: { type: boolean, default: false }
    SensorFaultRequest:
      type: object
      additionalProperties: false
      required: [fault]
      properties:
        fault: { type: string, enum: [stuck_occupied, stuck_free, silent, none] }
    SimulatorEvent:
      type: object
      additionalProperties: false
      required: [seq, at, device, type, result]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
        at: { type: string, format: date-time }
        device: { type: string }
        type: { type: string }
        result: { type: string }
        reason: { type: string }
        car_id: { type: string }
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          description: Service name.
        version:
          type: string
          description: Build version of the running binary.
    ReadinessChecks:
      type: object
      additionalProperties: false
      required: [database, migrations]
      properties:
        database:
          type: string
          enum: [ok, fail]
        migrations:
          type: string
          enum: [ok, behind, fail]
        listener:
          type: string
          description: Postgres LISTEN connection behind the availability stream. Present once the listener runs.
          enum: [ok, fail]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          $ref: "#/components/schemas/ReadinessChecks"
    Page:
      type: object
      additionalProperties: false
      required: [limit, next_cursor]
      properties:
        limit:
          type: integer
          description: Maximum number of items in this page.
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page, or null on the last page.
    Meta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
          description: Request correlation identifier, equal to the X-Request-Id header.
        page:
          $ref: "#/components/schemas/Page"
    ListMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [page]
          properties:
            page: { $ref: "#/components/schemas/Page" }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable code in "<domain>.<reason>" snake_case
            format. This is the client contract; see
            packages/contracts/src/error-codes.ts.
          pattern: '^[a-z][a-z0-9_]*[.][a-z][a-z0-9_]*$'
        message:
          type: string
          description: Developer-facing message. Never shown to end users.
        details:
          type: object
          description: >-
            Structured context for the error. Always present, possibly as an
            empty object {}. For health.not_ready it carries the
            ReadinessChecks object.
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/Meta"
    LegalDocument:
      type: object
      additionalProperties: false
      required: [version, published_at, url_es, url_en]
      properties:
        version: { type: string }
        published_at: { type: string, format: date-time }
        url_es: { type: string }
        url_en: { type: string }
    LegalCurrent:
      type: object
      additionalProperties: false
      required: [terms, privacy]
      properties:
        terms: { $ref: "#/components/schemas/LegalDocument" }
        privacy: { $ref: "#/components/schemas/LegalDocument" }
    AcceptedStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: accepted }
    UserLegal:
      type: object
      additionalProperties: false
      required: [terms_version, terms_accepted_at, privacy_version, privacy_accepted_at]
      properties:
        terms_version: { type: [string, "null"] }
        terms_accepted_at: { type: [string, "null"], format: date-time }
        privacy_version: { type: [string, "null"] }
        privacy_accepted_at: { type: [string, "null"], format: date-time }
    User:
      type: object
      additionalProperties: false
      required:
        [id, email, first_name, last_name, phone, role, status, locale, email_verified_at, legal, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string, minLength: 1, maxLength: 60 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: [string, "null"], description: E.164. }
        role: { type: string, enum: [driver, admin] }
        status: { type: string, enum: [pending_verification, active, suspended] }
        locale: { type: string, enum: [es-DO, en] }
        email_verified_at: { type: [string, "null"], format: date-time }
        legal: { $ref: "#/components/schemas/UserLegal" }
        created_at: { type: string, format: date-time }
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        [access_token, token_type, expires_in, refresh_token, refresh_expires_in, legal_acceptance_required, user]
      properties:
        access_token: { type: string, description: JWT. }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
        refresh_token: { type: string, description: Opaque base64url token. }
        refresh_expires_in: { type: integer, description: Refresh token lifetime in seconds. }
        legal_acceptance_required: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
    Vehicle:
      type: object
      additionalProperties: false
      required: [id, plate, plate_normalized, make, model, color, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        plate: { type: string, description: Plate as the driver typed it. }
        plate_normalized: { type: string, pattern: '^[A-Z0-9]{2,10}$' }
        make: { type: string }
        model: { type: string }
        color: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, first_name, last_name, status, locale, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string, minLength: 1, maxLength: 60 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [pending_verification, active, suspended] }
        locale: { type: string, enum: [es-DO, en] }
        created_at: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name, accepted_terms_version, accepted_privacy_version]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        first_name: { type: string, minLength: 1, maxLength: 60 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        phone:
          type: string
          pattern: '^(\+[1-9][0-9]{6,14})?$'
          description: E.164. An empty string means no phone.
        locale: { type: string, enum: [es-DO, en], default: es-DO }
        accepted_terms_version: { type: string }
        accepted_privacy_version: { type: string }
    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    LoginRequest:
      type: object
      required: [email, password, client_kind]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 128 }
        client_kind: { type: string, enum: [web, mobile] }
    RefreshSessionRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: >-
            Opaque token. No length rule is enforced here; an empty or
            malformed token is answered 401 auth.refresh_invalid.
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    ResetPasswordRequest:
      type: object
      required: [email, code, new_password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        new_password: { type: string, minLength: 10, maxLength: 128 }
    AcceptInvitationRequest:
      type: object
      required: [email, code, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        password: { type: string, minLength: 10, maxLength: 128 }
    UpdateMeRequest:
      type: object
      properties:
        first_name: { type: string, minLength: 1, maxLength: 60 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        phone:
          type: [string, "null"]
          pattern: '^(\+[1-9][0-9]{6,14})?$'
          description: E.164. Null or an empty string clears the phone.
        locale: { type: string, enum: [es-DO, en] }
    DeleteMeRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128 }
    AcceptLegalRequest:
      type: object
      required: [terms_version, privacy_version]
      properties:
        terms_version: { type: string }
        privacy_version: { type: string }
    CreateVehicleRequest:
      type: object
      required: [plate, make, model, color]
      properties:
        plate:
          type: string
          minLength: 2
          maxLength: 15
          description: >-
            Normalized (uppercase, spaces and dashes removed) and then
            checked against ^[A-Z0-9]{2,10}$.
        make: { type: string, minLength: 1, maxLength: 50 }
        model: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, minLength: 1, maxLength: 30 }
    UpdateVehicleRequest:
      type: object
      properties:
        plate: { type: string, minLength: 2, maxLength: 15 }
        make: { type: string, minLength: 1, maxLength: 50 }
        model: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, minLength: 1, maxLength: 30 }
    CreateAdminRequest:
      type: object
      required: [email, first_name, last_name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        first_name: { type: string, minLength: 1, maxLength: 60 }
        last_name: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string, enum: [es-DO, en], default: es-DO }
    LotSummary:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    Lot:
      type: object
      additionalProperties: false
      required: [id, slug, name, address, latitude, longitude, map_url, timezone, capacity, opening_hours, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        address: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        map_url:
          type: string
          description: Built server-side, from the coordinates when present, else the address.
        timezone: { type: string, examples: [America/Santo_Domingo] }
        capacity: { type: integer }
        opening_hours:
          type: object
          additionalProperties: false
          description: Only always_open exists in M2.
          required: [always_open]
          properties:
            always_open: { type: boolean }
        status:
          type: string
          enum: [open, full, closed]
    Availability:
      type: object
      additionalProperties: false
      required:
        - lot_id
        - available
        - occupied
        - effective_capacity
        - capacity
        - effective_holds
        - upcoming_reservations_2h
        - status
        - version
        - updated_at
      properties:
        lot_id: { type: string, format: uuid }
        available: { type: integer, minimum: 0 }
        occupied: { type: integer, minimum: 0 }
        effective_capacity:
          type: integer
          description: Capacity minus the spaces that are out of service.
        capacity: { type: integer }
        effective_holds: { type: integer, minimum: 0 }
        upcoming_reservations_2h: { type: integer, minimum: 0 }
        status:
          type: string
          description: Precedence is closed, then full, then open.
          enum: [open, full, closed]
        version:
          type: integer
          format: int64
          description: Increases with every change. It is the SSE event id.
        updated_at:
          type: string
          format: date-time
          description: When the occupancy last changed.
    SpaceState:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code: { type: string, examples: [E001] }
        state:
          type: string
          enum: [free, occupied, out_of_service]
    LotSpaces:
      type: object
      additionalProperties: false
      required: [spaces]
      properties:
        spaces:
          type: array
          description: Every space, ordered by code.
          items: { $ref: "#/components/schemas/SpaceState" }
    Tariff:
      type: object
      additionalProperties: false
      required:
        - effective_from
        - currency
        - first_hour_cents
        - additional_hour_cents
        - exit_grace_minutes
        - post_payment_exit_minutes
        - daily_cap_cents
        - lost_ticket_cents
        - reservation_fee_cents
      properties:
        effective_from: { type: string, format: date-time }
        currency: { type: string, examples: [DOP] }
        first_hour_cents: { type: integer, format: int64 }
        additional_hour_cents: { type: integer, format: int64 }
        exit_grace_minutes: { type: integer }
        post_payment_exit_minutes: { type: integer }
        daily_cap_cents: { type: integer, format: int64 }
        lost_ticket_cents: { type: integer, format: int64 }
        reservation_fee_cents: { type: integer, format: int64 }
    SpacesEvent:
      type: object
      additionalProperties: false
      description: Payload of the `spaces` SSE event.
      required: [full, spaces]
      properties:
        full:
          type: boolean
          description: True for a complete snapshot, false for a delta.
        spaces:
          type: array
          items: { $ref: "#/components/schemas/SpaceState" }
    HeartbeatEvent:
      type: object
      additionalProperties: false
      description: Payload of the `heartbeat` SSE event.
      required: [as_of]
      properties:
        as_of: { type: string, format: date-time }
    DeviceEvent:
      description: >-
        One device event, discriminated by `type`. Allowed device kinds per
        type: podium (`podium.vehicle_detected`), dispenser and entry barrier
        (`entry.credential_presented`), entry and exit barrier
        (`barrier.passed`), pay station (`paystation.*`), exit barrier
        (`exit.credential_presented`), sensor gateway
        (`sensor.space_changed`), any kind (`heartbeat`). Within a type the
        credential kind and direction are restricted too: a dispenser may send
        only `ticket_request`, an entry barrier only `employee_card` or
        `reservation_qr` and direction `entry`, an exit barrier only direction
        `exit`. `occurred_at` must not be more than 60 s ahead of the server
        clock.
      oneOf:
        - $ref: "#/components/schemas/DeviceEventPodiumVehicleDetected"
        - $ref: "#/components/schemas/DeviceEventEntryCredentialPresented"
        - $ref: "#/components/schemas/DeviceEventBarrierPassed"
        - $ref: "#/components/schemas/DeviceEventPaystationScan"
        - $ref: "#/components/schemas/DeviceEventPaystationLostTicket"
        - $ref: "#/components/schemas/DeviceEventPaystationCashPaid"
        - $ref: "#/components/schemas/DeviceEventExitCredentialPresented"
        - $ref: "#/components/schemas/DeviceEventSensorSpaceChanged"
        - $ref: "#/components/schemas/DeviceEventHeartbeat"
      discriminator:
        propertyName: type
        mapping:
          podium.vehicle_detected: "#/components/schemas/DeviceEventPodiumVehicleDetected"
          entry.credential_presented: "#/components/schemas/DeviceEventEntryCredentialPresented"
          barrier.passed: "#/components/schemas/DeviceEventBarrierPassed"
          paystation.scan: "#/components/schemas/DeviceEventPaystationScan"
          paystation.lost_ticket: "#/components/schemas/DeviceEventPaystationLostTicket"
          paystation.cash_paid: "#/components/schemas/DeviceEventPaystationCashPaid"
          exit.credential_presented: "#/components/schemas/DeviceEventExitCredentialPresented"
          sensor.space_changed: "#/components/schemas/DeviceEventSensorSpaceChanged"
          heartbeat: "#/components/schemas/DeviceEventHeartbeat"
    DeviceEventPodiumVehicleDetected:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [podium.vehicle_detected] }
        occurred_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: false }
    DeviceEventEntryCredentialPresented:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [entry.credential_presented] }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: false
          required: [kind]
          description: >-
            `value` is required for `employee_card` and `reservation_qr` and
            absent for `ticket_request`.
          properties:
            kind: { type: string, enum: [ticket_request, employee_card, reservation_qr] }
            value: { type: string, minLength: 1, maxLength: 512 }
    DeviceEventBarrierPassed:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [barrier.passed] }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: false
          required: [direction, stay_id]
          properties:
            direction: { type: string, enum: [entry, exit] }
            stay_id: { type: string, format: uuid }
    DeviceEventPaystationScan:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [paystation.scan] }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: false
          required: [credential]
          properties:
            credential: { $ref: "#/components/schemas/DeviceCredential" }
    DeviceEventPaystationLostTicket:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [paystation.lost_ticket] }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: false
          required: [stay_id]
          properties:
            stay_id: { type: string, format: uuid }
    DeviceEventPaystationCashPaid:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [paystation.cash_paid] }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: false
          required: [stay_id, amount_cents]
          properties:
            stay_id: { type: string, format: uuid }
            amount_cents:
              type: integer
              format: int64
              minimum: 1
              description: >-
                Must equal the amount due. There is no fixed upper bound, so a
                real amount due is never rejected.
    DeviceEventExitCredentialPresented:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [exit.credential_presented] }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: false
          required: [credential]
          properties:
            credential: { $ref: "#/components/schemas/DeviceCredential" }
    DeviceEventSensorSpaceChanged:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [sensor.space_changed] }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: false
          required: [space_code, occupied]
          properties:
            space_code: { type: string, pattern: '^E[0-9]{3}$' }
            occupied: { type: boolean }
    DeviceEventHeartbeat:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [heartbeat] }
        occurred_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: false }
    DeviceCredential:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { type: string, enum: [ticket, employee_card, reservation_qr] }
        value: { type: string, minLength: 1, maxLength: 512 }
    FeeBreakdown:
      type: object
      additionalProperties: false
      description: >-
        How an amount was computed. For `overstay`, the durations describe the
        segment since the latest payment and `billed_from` is that payment's
        `paid_at`; for every other kind `billed_from` is null and the durations
        describe the whole stay. `paid_cents` is always the stay's total paid.
      required:
        - kind
        - duration_seconds
        - full_blocks
        - remainder_seconds
        - billed_from
        - paid_cents
        - tariff_effective_from
      properties:
        kind: { type: string, enum: [time, grace, lost_ticket, employee, overstay, paid] }
        duration_seconds: { type: integer, format: int64 }
        full_blocks: { type: integer, format: int64 }
        remainder_seconds: { type: integer, format: int64 }
        billed_from: { type: [string, "null"], format: date-time }
        paid_cents: { type: integer, format: int64 }
        tariff_effective_from: { type: string, format: date-time }
    DeviceEventResult:
      type: object
      additionalProperties: false
      description: >-
        The synchronous answer to a device event. `open` and `deny` answer
        credential events, `ack` a handled event, `rejected` a refused one;
        `reason` carries the error code of a refusal (`gate.*`, `lot.*`,
        `reservation.too_early` and `reservation.window_closed` for a reservation
        QR outside its window) or `gate.duplicate_pass` on an acknowledged duplicate. Which optional
        fields appear depends on the event type.
      required: [result]
      properties:
        result: { type: string, enum: [ack, open, deny, rejected] }
        reason: { type: string }
        stay_id: { type: string, format: uuid }
        ticket_code: { type: string }
        status: { type: string }
        amount_cents: { type: integer, format: int64 }
        breakdown: { $ref: "#/components/schemas/FeeBreakdown" }
        receipt_no: { type: string }
        paid_at: { type: string, format: date-time }
        exit_deadline: { type: string, format: date-time }
    ReservationVehicle:
      type: object
      additionalProperties: false
      required: [id, plate_display, make, model, color]
      properties:
        id: { type: string, format: uuid }
        plate_display: { type: string }
        make: { type: string }
        model: { type: string }
        color: { type: string }
    HoldWindow:
      type: object
      additionalProperties: false
      description: The window in which a space is held for the reservation. `ends_at` is exclusive.
      required: [starts_at, ends_at]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    LatestPayment:
      type: object
      additionalProperties: false
      description: The newest fee attempt, so a client sees `pending` (the 202 path) or `failed` with its `failure_code`.
      required: [id, status, failure_code]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, succeeded, failed, refunded] }
        failure_code:
          type: [string, "null"]
          enum: [card_declined, card_not_supported, not_submitted, null]
    ReservationRefund:
      type: object
      additionalProperties: false
      required: [id, status, amount_cents, reason, succeeded_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, succeeded, failed] }
        amount_cents: { type: integer, format: int64 }
        reason: { type: string, enum: [cancelled_before_arrival, facility_unavailable, facility_closed, admin_override] }
        succeeded_at: { type: [string, "null"], format: date-time }
    ReservationStay:
      type: object
      additionalProperties: false
      description: The stay summary of a checked-in or completed reservation.
      required: [entered_at, exited_at, parking_paid_cents]
      properties:
        entered_at: { type: string, format: date-time }
        exited_at: { type: [string, "null"], format: date-time }
        parking_paid_cents: { type: integer, format: int64 }
    Reservation:
      type: object
      additionalProperties: false
      required:
        - id
        - lot_id
        - vehicle
        - arrival_at
        - hold_window
        - status
        - fee_cents
        - payment_due_at
        - created_at
        - confirmed_at
        - cancelled_at
        - cancelled_by
        - refund_reason
        - checked_in_at
        - completed_at
        - expired_at
        - latest_payment
        - refund
        - stay
      properties:
        id: { type: string, format: uuid }
        lot_id: { type: string, format: uuid }
        vehicle: { $ref: "#/components/schemas/ReservationVehicle" }
        arrival_at: { type: string, format: date-time, description: Normalized to a 5-minute UTC boundary. }
        hold_window: { $ref: "#/components/schemas/HoldWindow" }
        status:
          type: string
          enum: [pending_payment, confirmed, checked_in, completed, cancelled, expired_unpaid, expired_no_show]
        fee_cents: { type: integer, format: int64 }
        payment_due_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        cancelled_by: { type: [string, "null"], enum: [driver, admin, system, null] }
        refund_reason:
          type: [string, "null"]
          enum: [cancelled_before_arrival, none_after_arrival, facility_unavailable, facility_closed, admin_override, null]
        checked_in_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        expired_at: { type: [string, "null"], format: date-time }
        latest_payment:
          oneOf: [{ $ref: "#/components/schemas/LatestPayment" }, { type: "null" }]
        refund:
          oneOf: [{ $ref: "#/components/schemas/ReservationRefund" }, { type: "null" }]
        stay:
          oneOf: [{ $ref: "#/components/schemas/ReservationStay" }, { type: "null" }]
    ReservationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Reservation" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [lot_id, arrival_at]
      properties:
        lot_id: { type: string, format: uuid }
        arrival_at: { type: string, format: date-time, description: Any UTC offset or fraction of a second. }
        vehicle_id: { type: string, format: uuid }
    Quote:
      type: object
      additionalProperties: false
      required: [lot_id, arrival_at, hold_window, fee_cents, payment_timeout_min]
      properties:
        lot_id: { type: string, format: uuid }
        arrival_at: { type: string, format: date-time, description: Normalized to a 5-minute UTC boundary. }
        hold_window: { $ref: "#/components/schemas/HoldWindow" }
        fee_cents: { type: integer, format: int64 }
        payment_timeout_min: { type: integer }
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required: [lot_id, vehicle_id, arrival_at]
      properties:
        lot_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        arrival_at: { type: string, format: date-time, description: Any UTC offset or fraction of a second. }
    ChangeVehicleRequest:
      type: object
      additionalProperties: false
      required: [vehicle_id]
      properties:
        vehicle_id: { type: string, format: uuid }
    PayRequest:
      type: object
      additionalProperties: false
      required: [card_number, exp_month, exp_year, cvc]
      properties:
        card_number: { type: string, description: Spaces and hyphens are ignored. }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer, minimum: 2000, maximum: 2099, description: Four digits. }
        cvc: { type: string }
    PayPending:
      type: object
      additionalProperties: false
      required: [reservation, payment]
      properties:
        reservation: { $ref: "#/components/schemas/Reservation" }
        payment:
          type: object
          additionalProperties: false
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [pending] }
    ReservationQr:
      type: object
      additionalProperties: false
      description: >-
        `entry_valid_from` and `entry_valid_until` bound entry only. They are
        not the token's expiry: the same token keeps working at the pay
        station and at exit while the reservation is `checked_in`, so clients
        must keep showing it after `entry_valid_until` once checked in.
      required: [token, entry_valid_from, entry_valid_until]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{86}$', description: Secret. Never log or share it. }
        entry_valid_from: { type: string, format: date-time }
        entry_valid_until: { type: string, format: date-time }
    Receipt:
      type: object
      additionalProperties: false
      description: A payment of the current driver. `receipt_no` is null unless it is `succeeded` or `refunded`.
      required:
        - id
        - receipt_no
        - kind
        - method
        - amount_cents
        - status
        - card_brand
        - card_last4
        - failure_code
        - reservation_id
        - created_at
        - succeeded_at
        - refunded_at
        - refund
      properties:
        id: { type: string, format: uuid }
        receipt_no: { type: [string, "null"] }
        kind: { type: string, enum: [reservation_fee, parking_fee] }
        method: { type: string, enum: [gateway_sim, cash, none] }
        amount_cents: { type: integer, format: int64 }
        status: { type: string, enum: [pending, succeeded, failed, refunded] }
        card_brand: { type: [string, "null"], enum: [visa, mastercard, amex, other, null] }
        card_last4: { type: [string, "null"], pattern: '^[0-9]{4}$' }
        failure_code: { type: [string, "null"], enum: [card_declined, card_not_supported, not_submitted, null] }
        reservation_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        succeeded_at: { type: [string, "null"], format: date-time }
        refunded_at: { type: [string, "null"], format: date-time }
        refund:
          oneOf: [{ $ref: "#/components/schemas/ReservationRefund" }, { type: "null" }]
    ReceiptList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Receipt" }
        meta: { $ref: "#/components/schemas/ListMeta" }
  parameters:
    CarId:
      name: car_id
      in: path
      required: true
      description: Simulator car id, for example `car-000001`.
      schema: { type: string, pattern: '^car-[0-9]{6,}$' }
    ReservationId:
      name: id
      in: path
      required: true
      description: Reservation id. A malformed, unknown or another driver's id is answered 404 reservation.not_found.
      schema: { type: string, format: uuid }
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Device public id (uuid).
      schema: { type: string, format: uuid }
    DeviceTimestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Signing time, RFC 3339 UTC with `Z`, within 60 s of the server clock. Used verbatim in the canonical string.
      schema: { type: string, format: date-time }
    DeviceSignature:
      name: X-Signature
      in: header
      required: true
      description: Lowercase hex HMAC-SHA256 (64 characters) of the canonical string.
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    LotId:
      name: id
      in: path
      required: true
      description: Lot public id. A slug, a malformed id or an unknown id is answered 404 lot.not_found.
      schema: { type: string, format: uuid }
  headers:
    IdempotentReplayed:
      description: Present, with the value `true`, only when this is the stored answer of an earlier call.
      schema: { type: string, enum: ["true"] }
  securitySchemes:
    simulatorToken:
      type: apiKey
      in: header
      name: X-Simulator-Token
      description: >-
        Shared secret of the simulator control API, compared in constant time.
        A missing or wrong value is 401 `simulator.unauthorized`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceId:
      type: apiKey
      in: header
      name: X-Device-Id
      description: >-
        Device public id. Part of the `deviceHmac` requirement, which needs
        `X-Device-Id`, `X-Timestamp` and `X-Signature` together. The signature
        is `hex(HMAC-SHA256(device_secret, canonical))` with
        `canonical = METHOD + "\n" + REQUEST_URI + "\n" + X-Timestamp + "\n" + hex(sha256(raw body))`.
        `REQUEST_URI` is the path plus the raw query exactly as sent, the
        timestamp is used verbatim, and hex is lowercase.
    deviceTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp
      description: Signing time (RFC 3339, UTC, `Z`). Part of the `deviceHmac` requirement.
    deviceSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: Lowercase hex HMAC-SHA256 of the canonical string. Part of the `deviceHmac` requirement.
  responses:
    SimulatorUnauthorized:
      description: The `X-Simulator-Token` header is missing or wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: simulator.unauthorized, message: simulator unauthorized, details: {} }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    SimulatorNotRunning:
      description: No scenario is running, or the running one is stopping and takes no more work.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: simulator.not_running, message: scenario not running, details: {} }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    Accepted:
      description: Request accepted. The answer is the same whether or not the account exists.
      content:
        application/json:
          schema:
            allOf:
              - type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/AcceptedStatus" }
                  meta: { $ref: "#/components/schemas/Meta" }
    BadRequest:
      description: The body is not valid JSON or has the wrong JSON types.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: http.invalid_json, message: invalid json body, details: {} }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    PayloadTooLarge:
      description: The body is larger than 64 KiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: http.payload_too_large, message: payload too large, details: {} }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    UnsupportedMediaType:
      description: The body is not application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: http.unsupported_media_type, message: unsupported media type, details: {} }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    ValidationFailed:
      description: >-
        Input validation failed. error.details.fields lists field, rule and
        param. The submitted value is never echoed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: validation.failed
              message: validation failed
              details: { fields: [{ field: email, rule: email }] }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    ValidationOrCodeInvalid:
      description: >-
        Either input validation failed (validation.failed) or the code is
        wrong, expired or used (auth.code_invalid).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            validationFailed:
              summary: A field is invalid.
              value:
                error:
                  code: validation.failed
                  message: validation failed
                  details: { fields: [{ field: code, rule: code6 }] }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
            codeInvalid:
              summary: The code is wrong, expired or already used.
              value:
                error: { code: auth.code_invalid, message: code invalid, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: rate_limit.exceeded
              message: rate limit exceeded
              details: { retry_after_seconds: 30 }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    Unauthorized:
      description: The bearer token is missing or invalid, or the session was revoked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            unauthenticated:
              summary: Missing, malformed, expired or badly signed token.
              value:
                error: { code: auth.unauthenticated, message: unauthenticated, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
            sessionRevoked:
              summary: The session was revoked.
              value:
                error: { code: auth.session_revoked, message: session revoked, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    Forbidden:
      description: The role is not allowed, or the account is suspended.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            forbidden:
              summary: The role is not allowed on this route.
              value:
                error: { code: auth.forbidden, message: forbidden, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
            accountSuspended:
              summary: The account is suspended.
              value:
                error: { code: auth.account_suspended, message: account suspended, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    ForbiddenLegal:
      description: >-
        The role is not allowed, the account is suspended, or a driver must
        accept the current legal documents first.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            forbidden:
              summary: The role is not allowed on this route.
              value:
                error: { code: auth.forbidden, message: forbidden, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
            accountSuspended:
              summary: The account is suspended.
              value:
                error: { code: auth.account_suspended, message: account suspended, details: {} }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
            legalAcceptanceRequired:
              summary: The driver has not accepted the current legal versions.
              value:
                error:
                  code: legal.acceptance_required
                  message: legal acceptance required
                  details: { terms_version: "2026-11-16", privacy_version: "2026-11-16" }
                meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    VehicleNotFound:
      description: The vehicle does not exist, is deleted, is owned by someone else, or the id is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: vehicle.not_found, message: vehicle not found, details: {} }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    InternalError:
      description: >-
        An unexpected server error. The cause is logged server-side and never
        returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: internal.unexpected, message: internal error, details: {} }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    LotNotFound:
      description: The lot does not exist, or the id is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: lot.not_found, message: lot not found, details: {} }
            meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 }
    ReservationOk:
      description: The reservation.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { $ref: "#/components/schemas/Reservation" }
              meta: { $ref: "#/components/schemas/Meta" }
    ReservationNotFound:
      description: The reservation does not exist, is not the driver's, or the id is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: reservation.not_found, message: reservation not found, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
    LotOrVehicleNotFound:
      description: The lot or the vehicle does not exist, or the vehicle is not the driver's.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            lotNotFound:
              value: { error: { code: lot.not_found, message: lot not found, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
            vehicleNotFound:
              value: { error: { code: vehicle.not_found, message: vehicle not found, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
    ReservationRefused:
      description: >-
        The reservation is refused: a no-show block (`details.blocked_until`),
        a closed lot, an active reservation already held, no free space for an
        arrival this soon, or the cap reached in the window.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            blockedNoShows:
              value: { error: { code: reservation.blocked_no_shows, message: reservations blocked, details: { blocked_until: "2026-12-08T15:00:00Z" } }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
            lotClosed:
              value: { error: { code: reservation.lot_closed, message: lot closed, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
            activeExists:
              value: { error: { code: reservation.active_exists, message: active reservation exists, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
            noSpaceNow:
              value: { error: { code: reservation.no_space_now, message: no space now, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
            capacityReached:
              value: { error: { code: reservation.capacity_reached, message: capacity reached, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
    ReservationArrivalInvalid:
      description: Input validation failed, the arrival time is in the past, or it is beyond the booking horizon.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            validationFailed:
              value: { error: { code: validation.failed, message: validation failed, details: { fields: [{ field: arrival_at, rule: datetime }] } }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
            arrivalInPast:
              value: { error: { code: reservation.arrival_in_past, message: arrival in the past, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
            beyondHorizon:
              value: { error: { code: reservation.beyond_horizon, message: arrival beyond horizon, details: {} }, meta: { request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9 } }
