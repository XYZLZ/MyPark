openapi: 3.1.0
info:
  title: MyPark API
  version: 0.1.0
  description: >-
    MyPark HTTP API. Every response uses the baseline envelope: data and meta
    on success, error and meta on failure.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 while the process is up. Does not check dependencies.
      tags: [health]
      security: []
      responses:
        "200":
          description: The service is alive.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        $ref: "#/components/schemas/Health"
                      meta:
                        $ref: "#/components/schemas/Meta"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        Returns 200 when the database is reachable and migrations are current.
        Otherwise returns 503 with code "health.not_ready" and the same checks
        object in error.details.
      tags: [health]
      security: []
      responses:
        "200":
          description: The service is ready to serve traffic.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        $ref: "#/components/schemas/Readiness"
                      meta:
                        $ref: "#/components/schemas/Meta"
        "503":
          description: The service is not ready. error.code is "health.not_ready".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: health.not_ready
                  message: service is not ready
                  details:
                    database: ok
                    migrations: behind
                meta:
                  request_id: 01HZX3V8Q2W9K7M4N5P6R7S8T9
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          description: Service name.
        version:
          type: string
          description: Build version of the running binary.
    ReadinessChecks:
      type: object
      additionalProperties: false
      required: [database, migrations]
      properties:
        database:
          type: string
          enum: [ok, fail]
        migrations:
          type: string
          enum: [ok, behind, fail]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          $ref: "#/components/schemas/ReadinessChecks"
    Page:
      type: object
      additionalProperties: false
      required: [limit, next_cursor]
      properties:
        limit:
          type: integer
          description: Maximum number of items in this page.
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page, or null on the last page.
    Meta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
          description: Request correlation identifier, equal to the X-Request-Id header.
        page:
          $ref: "#/components/schemas/Page"
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable code in "<domain>.<reason>" snake_case
            format. This is the client contract; see
            packages/contracts/src/error-codes.ts.
          pattern: '^[a-z][a-z0-9_]*[.][a-z][a-z0-9_]*$'
        message:
          type: string
          description: Developer-facing message. Never shown to end users.
        details:
          type: object
          description: >-
            Structured context for the error. Always present, possibly as an
            empty object {}. For health.not_ready it carries the
            ReadinessChecks object.
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/Meta"
