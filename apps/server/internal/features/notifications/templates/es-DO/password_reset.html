<!doctype html>
<html lang="es-DO">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#ffffff;font:16px/1.5 Arial,Helvetica,sans-serif;color:#111827">
{{template "brand_header"}}
<div style="padding:24px">
<p>Hola{{with .first_name}} {{.}}{{end}},</p>
<p>Recibimos una solicitud para restablecer tu contraseña. Usa este código; vence en 15 minutos.</p>
<p>Tu código es:</p>
{{template "code_box" .}}
<p>Si no fuiste tú, puedes ignorar este mensaje.</p>
{{template "brand_footer"}}
</div>
</body>
</html>
