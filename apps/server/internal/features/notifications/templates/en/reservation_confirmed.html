<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#ffffff;font:16px/1.5 Arial,Helvetica,sans-serif;color:#111827">
{{template "brand_header"}}
<div style="padding:24px">
<p>Hello{{with .first_name}} {{.}}{{end}},</p>
<p>Your reservation is confirmed.</p>
<p>Vehicle: <strong>{{.plate_display}}</strong><br>
Arrival: <strong>{{.arrival_at}}</strong><br>
Entry window: <strong>{{.window}}</strong><br>
<span style="color:#6b7280">(Santo Domingo time)</span></p>
<p>Show this QR code, or the one in the app, at the entry barrier.</p>
<p><img src="cid:qr" alt="Reservation QR code" width="240" height="240" style="display:block;margin:16px 0"></p>
{{template "brand_footer"}}
</div>
</body>
</html>
