# MyPark local development stack.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
# Works with no .env file: every variable has an inline dev-only default
# (${VAR:-default}). Override any of them in the shell environment. Never
# reuse these credentials outside local development.
#
# Boot order: postgres (healthy) -> migrate (exits 0) -> seed (exits 0) ->
# api, worker -> web (once api is healthy). postgres creates the
# mypark_migrator and mypark_app roles on first start from ./postgres/init/01-roles.sh.

name: mypark

x-server-build: &server-build
  context: ../../apps/server
  dockerfile: Dockerfile

x-migrator-url: &migrator-url postgres://mypark_migrator:${MYPARK_MIGRATOR_PASSWORD:-dev_migrator}@postgres:5432/${POSTGRES_DB:-mypark}?sslmode=disable
x-app-url: &app-url postgres://mypark_app:${MYPARK_APP_PASSWORD:-dev_app}@postgres:5432/${POSTGRES_DB:-mypark}?sslmode=disable

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mypark}
      # Read by ./postgres/init/01-roles.sh on first start only.
      MYPARK_MIGRATOR_PASSWORD: ${MYPARK_MIGRATOR_PASSWORD:-dev_migrator}
      MYPARK_APP_PASSWORD: ${MYPARK_APP_PASSWORD:-dev_app}
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 forces TCP. While init scripts run, the entrypoint's
      # temporary server listens on the unix socket only, so a socket check
      # would report ready before the roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  migrate:
    build:
      <<: *server-build
      args:
        CMD: migrate
        VERSION: ${VERSION:-dev}
    image: mypark/migrate:${VERSION:-dev}
    environment:
      MIGRATOR_DATABASE_URL: *migrator-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      <<: *server-build
      args:
        CMD: seed
        VERSION: ${VERSION:-dev}
    image: mypark/seed:${VERSION:-dev}
    environment:
      DATABASE_URL: *app-url
    depends_on:
      postgres:
        condition: service_healthy
      # The seed writes to tables the migrations create.
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      <<: *server-build
      args:
        CMD: api
        VERSION: ${VERSION:-dev}
    image: mypark/api:${VERSION:-dev}
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: *app-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      # Dev-only defaults (config.DevJWTSigningKey / DevAuthCodePepper); the API
      # refuses them when APP_ENV=production.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-KOjknsSvcscUncFCKZZVyz6pIx6qzsgynPkmGSI5ap0=}
      JWT_KEY_ID: ${JWT_KEY_ID:-dev-1}
      JWT_VERIFY_KEYS: ${JWT_VERIFY_KEYS:-}
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER:-Vx+9DiL7uyqiwY3gQJqdTNupMJqGdpB+gmkk1YUbEwY=}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      MAX_VEHICLES_PER_USER: ${MAX_VEHICLES_PER_USER:-5}
    # All interfaces on purpose: a phone running Expo on the LAN must reach the
    # API. Every other published port is bound to loopback.
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      # distroless has no curl: the binary probes its own /readyz.
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      <<: *server-build
      args:
        CMD: worker
        VERSION: ${VERSION:-dev}
    image: mypark/worker:${VERSION:-dev}
    environment:
      WORKER_HEALTH_ADDR: ":8091"
      DATABASE_URL: *app-url
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-MyPark <no-reply@mypark.local>}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-8091}:8091"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/worker", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  simulator:
    build:
      <<: *server-build
      args:
        CMD: simulator
        VERSION: ${VERSION:-dev}
    image: mypark/simulator:${VERSION:-dev}
    environment:
      SIMULATOR_ADDR: ":8090"
    # Reached by the other services on the internal network as
    # http://simulator:8090; the port is published for local development only.
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "/app/simulator", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      # Repo root: the app needs the @mypark/contracts workspace and the root
      # package-lock.json.
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: mypark/web:${VERSION:-dev}
    environment:
      # Pinned to the compose network: a host-shell API_INTERNAL_URL (localhost) would point the container at itself.
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:22-alpine has busybox wget, not curl.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/es-DO >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    name: mypark-internal

volumes:
  pgdata:
